services:
    mysql:
        command: >-
            /opt/mysql/bin/mysqld --no-defaults --basedir=/opt/mysql
            --datadir="$HOME/.local/share/plaat-mysql"
            --socket="$HOME/.local/share/plaat-mysql/mysql.sock"
            --pid-file="$HOME/.local/share/plaat-mysql/mysql.pid"
            --init-file="$HOME/.local/share/plaat-mysql/init.sql"
            --bind-address=127.0.0.1 --port="$PORT" --mysqlx=OFF
            --innodb-buffer-pool-size=128M
        port: 3306
    postgres:
        command: >-
            /usr/lib/postgresql/15/bin/postgres
            -D "$HOME/.local/share/plaat-postgres"
            -h 127.0.0.1 -p "$PORT" -k /tmp
            -c fsync=off -c synchronous_commit=off
            -c shared_buffers=64MB
        port: 5432
    web:
        command: >-
            APP_URL="$PUBLIC_URL" ASSET_URL=/
            php artisan serve --host=0.0.0.0 --port="$PORT"
        port: 8000
        health: /up
        env:
            APP_NAME: Plaat Club
            MAIL_FROM_NAME: Plaat Club
            APP_DEBUG: 'false'
            MAIL_MAILER: smtp
            MAIL_HOST: 127.0.0.1
            MAIL_PORT: '1025'
            SOCIAL_DEMO_MODE: 'true'
        portal:
            title: Plaat Club social preview
    queue:
        command: php artisan queue:work --queue=default,release-enrichment --sleep=2 --tries=3 --timeout=7200
        env:
            APP_NAME: Plaat Club
            MAIL_FROM_NAME: Plaat Club
            APP_URL: ${services.web.publicURL}
            MAIL_MAILER: smtp
            MAIL_HOST: 127.0.0.1
            MAIL_PORT: '1025'
    scheduler:
        command: php artisan schedule:work
        env:
            APP_NAME: Plaat Club
            MAIL_FROM_NAME: Plaat Club
            APP_URL: ${services.web.publicURL}
            MAIL_MAILER: smtp
            MAIL_HOST: 127.0.0.1
            MAIL_PORT: '1025'
    mail:
        command: mailpit --listen "0.0.0.0:$PORT" --smtp 127.0.0.1:1025 --database storage/app/mailpit.db
        port: 8025
        health: /livez
        review: false
        portal:
            title: Plaat Club preview inbox
